<!DOCTYPE html>
<html>
<head>
  <title>Layout 1 - Div Only (No CSS)</title>
</head>
<body>

  <!-- Top HEADER Block -->
  <div>
    <hr>
    <div align="center">
      <h1>HEADER</h1>
    </div>
    <hr>
  </div>

  <!-- Middle Section: LEFT MENU and CONTENT -->
  <!-- Note: Without CSS, standard HTML aligns via block structure or nested tables/divs -->
  <div>
    <table width="100%" border="1" cellpadding="20" cellspacing="0">
      <tr>
        <td width="30%" valign="top">
          <div>
            <h2>LEFT MENU</h2>
            <div>Navigation Item 1</div>
            <div>Navigation Item 2</div>
            <div>Navigation Item 3</div>
          </div>
        </td>
        <td width="70%" valign="top">
          <div>
            <h2>CONTENT</h2>
            <div>Welcome to the main content area of layout1.html.</div>
            <div>Created using only HTML elements and div tags without CSS.</div>
          </div>
        </td>
      </tr>
    </table>
  </div>

  <!-- Bottom FOOTER Block -->
  <div>
    <hr>
    <div align="center">
      <h3>FOOTER</h3>
      <div>CSI3029 Assessment Q11 · Shaik Zabiullah (23MIC0007) · VIT Vellore</div>
    </div>
    <hr>
  </div>

</body>
</html>
