<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Part A: Customer & Delivery Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="checkout-wrapper">
    
    <!-- Multi-Step Stepper Header -->
    <header class="stepper-header">
      <div class="step-indicator active">
        <span class="step-num">1</span>
        <span class="step-title">Part A: Customer &amp; Delivery</span>
      </div>
      <div class="step-connector"></div>
      <div class="step-indicator">
        <span class="step-num">2</span>
        <span class="step-title">Part B: Payment Details</span>
      </div>
      <div class="step-connector"></div>
      <div class="step-indicator">
        <span class="step-num">3</span>
        <span class="step-title">Part C: Cart Summary</span>
      </div>
    </header>

    <div class="step-card">
      <div class="card-intro">
        <h2>Part A – Customer &amp; Delivery Details</h2>
        <p>Please enter your contact details and shipping address for package fulfillment.</p>
      </div>

      <!-- Part A Form -->
      <form action="part-b.html" method="GET" class="checkout-form">
        
        <div class="form-row">
          <div class="input-cell">
            <label for="custName">Customer Name (text) <span class="required">*</span></label>
            <input type="text" id="custName" name="customerName" placeholder="e.g. Shaik Zabiullah" required />
          </div>

          <div class="input-cell">
            <label for="custEmail">Email Address (email) <span class="required">*</span></label>
            <input type="email" id="custEmail" name="email" placeholder="shaik@vitstudent.ac.in" required />
          </div>
        </div>

        <div class="form-row">
          <div class="input-cell">
            <label for="custPhone">Mobile Number (tel) <span class="required">*</span></label>
            <input type="tel" id="custPhone" name="phone" placeholder="10-digit number" pattern="[0-9]{10}" required />
          </div>

          <div class="input-cell">
            <label for="deliveryDate">Delivery Date (date) <span class="required">*</span></label>
            <input type="date" id="deliveryDate" name="deliveryDate" required />
          </div>
        </div>

        <div class="input-cell full-width">
          <label for="deliveryAddress">Delivery Address (textarea) <span class="required">*</span></label>
          <textarea id="deliveryAddress" name="address" rows="3" placeholder="Flat/House No, Building, Street, Area..." required></textarea>
        </div>

        <div class="form-row three-col">
          <div class="input-cell">
            <label for="city">City (text) <span class="required">*</span></label>
            <input type="text" id="city" name="city" placeholder="e.g. Vellore" required />
          </div>

          <div class="input-cell">
            <label for="state">State (select) <span class="required">*</span></label>
            <select id="state" name="state" required>
              <option value="">-- Choose State --</option>
              <option value="Tamil Nadu" selected>Tamil Nadu</option>
              <option value="Andhra Pradesh">Andhra Pradesh</option>
              <option value="Karnataka">Karnataka</option>
              <option value="Kerala">Kerala</option>
              <option value="Maharashtra">Maharashtra</option>
              <option value="Delhi">Delhi NCR</option>
            </select>
          </div>

          <div class="input-cell">
            <label for="pincode">PIN Code (number) <span class="required">*</span></label>
            <input type="number" id="pincode" name="pincode" placeholder="632014" min="100000" max="999999" required />
          </div>
        </div>

        <div class="stepper-actions">
          <span class="step-status">Step 1 of 3</span>
          <button type="submit" class="btn-step-next">
            <span>Proceed to Part B (Payment Details)</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>

      </form>
    </div>

    <footer class="checkout-footer">
      CSI3029 Assessment Q27 (Part A) · Shaik Zabiullah (23MIC0007) · VIT Vellore
    </footer>

  </div>

</body>
</html>
