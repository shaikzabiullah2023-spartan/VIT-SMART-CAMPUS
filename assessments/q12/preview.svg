<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" width="100%" height="100%">
  <rect width="750" height="480" fill="#FFFFFF"/>
  <rect x="40" y="30" width="670" height="420" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

  <!-- <header> (Red) -->
  <rect x="60" y="50" width="630" height="60" rx="6" fill="#EF4444"/>
  <text x="375" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#FFFFFF">&lt;header&gt;</text>

  <!-- <nav> (Cyan) -->
  <rect x="60" y="120" width="630" height="45" rx="6" fill="#06B6D4"/>
  <text x="375" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF">&lt;nav&gt;</text>

  <!-- <section> (Amber) -->
  <rect x="60" y="175" width="400" height="95" rx="6" fill="#F59E0B"/>
  <text x="260" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">&lt;section&gt;</text>

  <!-- <aside> (Pink - spans both rows) -->
  <rect x="475" y="175" width="215" height="200" rx="6" fill="#EC4899"/>
  <text x="582" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">&lt;aside&gt;</text>

  <!-- <article> (Orange) -->
  <rect x="60" y="280" width="400" height="95" rx="6" fill="#F97316"/>
  <text x="260" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">&lt;article&gt;</text>

  <!-- <footer> (Slate) -->
  <rect x="60" y="385" width="630" height="50" rx="6" fill="#334155"/>
  <text x="375" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF">&lt;footer&gt;</text>
</svg>

