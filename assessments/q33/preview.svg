<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <rect width="850" height="500" fill="#0B0F19"/>

  <!-- Card Container -->
  <rect x="160" y="35" width="530" height="430" rx="16" fill="#131B2E" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Badge -->
  <rect x="330" y="55" width="190" height="24" rx="12" fill="rgba(249,115,22,0.15)" stroke="rgba(249,115,22,0.3)"/>
  <text x="425" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FB923C">UNIT VII · DOM MOUSE EVENTS</text>

  <!-- Title -->
  <text x="425" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Mouse Event Interaction</text>
  <text x="425" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">mouseover and mouseout event listener demonstration</text>

  <!-- Display Stage (Active State) -->
  <rect x="195" y="150" width="460" height="110" rx="12" fill="rgba(249,115,22,0.06)" stroke="#F97316" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="425" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748B" letter-spacing="1">DYNAMIC PAGE DISPLAY TEXT</text>
  
  <text x="425" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#F97316">Welcome to VIT!</text>
  <text x="425" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Event: 'mouseover' triggered on button</text>

  <!-- Interactive Button (Hovered appearance) -->
  <rect x="290" y="285" width="270" height="52" rx="12" fill="#F97316" filter="drop-shadow(0 0 15px rgba(249,115,22,0.6))"/>
  <text x="425" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">🖱️ Move Mouse Over Me</text>

  <!-- Telemetry Bar -->
  <line x1="195" y1="365" x2="655" y2="365" stroke="#1E293B"/>

  <rect x="210" y="380" width="130" height="32" rx="6" fill="#0A0F1D" stroke="#1E293B"/>
  <text x="275" y="401" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Hover: <tspan fill="#F97316" font-weight="bold">12</tspan></text>

  <rect x="360" y="380" width="130" height="32" rx="6" fill="#0A0F1D" stroke="#1E293B"/>
  <text x="425" y="401" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Leave: <tspan fill="#F97316" font-weight="bold">11</tspan></text>

  <rect x="510" y="380" width="130" height="32" rx="6" fill="#0A0F1D" stroke="#1E293B"/>
  <text x="575" y="401" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">State: <tspan fill="#FB923C" font-weight="bold">HOVERED</tspan></text>

  <text x="425" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748B">CSI3029 Assessment Q33 · Shaik Zabiullah (23MIC0007)</text>
</svg>

