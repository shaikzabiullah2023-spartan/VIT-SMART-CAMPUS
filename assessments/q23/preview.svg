<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#F1F5F9"/>
  <!-- Card Mockup -->
  <rect x="50" y="25" width="700" height="450" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>

  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#0F172A">Employee Registration Portal</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748B">HTML5 Input Types, Validation Attributes &amp; Embedded Video</text>

  <!-- Video mockup box -->
  <rect x="180" y="110" width="440" height="110" rx="6" fill="#1E293B"/>
  <circle cx="400" cy="165" r="22" fill="#2563EB"/>
  <polygon points="393,155 413,165 393,175" fill="#FFFFFF"/>
  <text x="400" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#CBD5E1">&lt;video controls&gt; Welcome Orientation</text>

  <!-- Form Fields Grid Simulation -->
  <!-- Row 1 -->
  <rect x="90" y="240" width="280" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="100" y="258" font-family="Arial, sans-serif" font-size="11" fill="#64748B">Full Name (text)</text>

  <rect x="430" y="240" width="280" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="440" y="258" font-family="Arial, sans-serif" font-size="11" fill="#64748B">Employee ID (pattern="^EMP\d{4}$")</text>

  <!-- Row 2 -->
  <rect x="90" y="280" width="280" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="100" y="298" font-family="Arial, sans-serif" font-size="11" fill="#64748B">Email Address (type="email")</text>

  <rect x="430" y="280" width="280" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="440" y="298" font-family="Arial, sans-serif" font-size="11" fill="#64748B">Mobile Number (type="tel")</text>

  <!-- Row 3: Checkboxes & Radios -->
  <rect x="90" y="325" width="620" height="35" rx="4" fill="#F1F5F9"/>
  <text x="105" y="347" font-family="Arial, sans-serif" font-size="11" fill="#334155">Gender: (o) Male  ( ) Female | Department: [Engineering ▾] | Skills: [x] HTML5 [x] CSS3</text>

  <!-- Action buttons -->
  <rect x="90" y="380" width="140" height="34" rx="4" fill="#2563EB"/>
  <text x="160" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">Submit Registration</text>

  <rect x="245" y="380" width="100" height="34" rx="4" fill="#E2E8F0"/>
  <text x="295" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">Reset</text>

  <text x="400" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">CSI3029 Assessment Q23 · Shaik Zabiullah (23MIC0007)</text>
</svg>

