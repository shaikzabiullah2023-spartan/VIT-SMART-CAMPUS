<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <rect width="850" height="500" fill="#090D16"/>

  <!-- Card Container -->
  <rect x="235" y="25" width="380" height="450" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Media Top -->
  <rect x="235" y="25" width="380" height="175" rx="16" fill="#0F172A"/>
  
  <!-- Specs Overlay in action -->
  <rect x="250" y="38" width="350" height="150" rx="10" fill="rgba(15,23,42,0.92)" stroke="#38BDF8"/>
  <text x="270" y="62" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#38BDF8">⚡ TECHNICAL SPECIFICATIONS (HOVER)</text>
  <text x="270" y="85" font-family="Arial, sans-serif" font-size="11" fill="#CBD5E1">● Chip: <tspan fill="#FFFFFF" font-weight="bold">M3 Max / 16-Core CPU</tspan></text>
  <text x="270" y="105" font-family="Arial, sans-serif" font-size="11" fill="#CBD5E1">● Memory: <tspan fill="#FFFFFF" font-weight="bold">36 GB Unified RAM</tspan></text>
  <text x="270" y="125" font-family="Arial, sans-serif" font-size="11" fill="#CBD5E1">● Display: <tspan fill="#FFFFFF" font-weight="bold">16.2" Liquid Retina XDR</tspan></text>
  <text x="270" y="145" font-family="Arial, sans-serif" font-size="11" fill="#CBD5E1">● Battery: <tspan fill="#FFFFFF" font-weight="bold">Up to 22 Hours</tspan></text>

  <!-- Body Content -->
  <text x="260" y="222" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#F97316" letter-spacing="1">PREMIUM WORKSTATION</text>
  <text x="260" y="246" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">ApexPro Ultra Studio 16"</text>
  <text x="260" y="268" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Engineered for extreme creative workloads &amp; AI models.</text>

  <!-- Details Button -->
  <rect x="260" y="285" width="330" height="36" rx="6" fill="#1F2937" stroke="#374151"/>
  <text x="425" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">Hide Details ▲</text>

  <!-- Details Panel (Revealed state) -->
  <rect x="260" y="332" width="330" height="90" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="275" y="354" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Unit Price:</text>
  <text x="575" y="354" text-anchor="end" font-family="Courier, monospace" font-size="13" font-weight="bold" fill="#38BDF8">₹2,49,900</text>

  <text x="275" y="380" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Inventory:</text>
  <text x="575" y="380" text-anchor="end" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34D399">● In Stock (14 Units)</text>

  <text x="275" y="405" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Warranty:</text>
  <text x="575" y="405" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#CBD5E1">3-Year AppleCare+</text>

  <!-- Footer -->
  <text x="425" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748B">CSI3029 Assessment Q35 · Shaik Zabiullah (23MIC0007)</text>
