<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-container">
    
    <!-- Login Header -->
    <div class="login-header">
      <div class="portal-badge">VIT VELLORE · ACADEMIC PORTAL</div>
      <h1>Student &amp; Faculty Login</h1>
      <p>Sign in with your registered university credentials.</p>
    </div>

    <!-- Embedded Audio Clip Explaining Login Instructions -->
    <div class="audio-instruction-box">
      <div class="audio-label">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <span>Audio Guide: Login Instructions &amp; Security Protocol</span>
      </div>
      <audio controls class="audio-player">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        <p>Your browser does not support the audio element. Instructions: Enter your VIT email and secure password.</p>
      </audio>
    </div>

    <!-- Login Form -->
    <form class="login-form" onsubmit="event.preventDefault(); alert('Login submitted successfully!');">
      
      <!-- User Role: Radio Buttons (Student / Faculty) -->
      <div class="form-group">
        <label class="group-title">Select User Role <span class="required">*</span></label>
        <div class="role-radio-group">
          <label class="role-option">
            <input type="radio" name="userRole" value="student" checked required />
            <span>Student</span>
          </label>
          <label class="role-option">
            <input type="radio" name="userRole" value="faculty" required />
            <span>Faculty</span>
          </label>
        </div>
      </div>

      <!-- Username or Email Address -->
      <div class="form-group">
        <label for="userIdentifier">Username or Email Address <span class="required">*</span></label>
        <input 
          type="text" 
          id="userIdentifier" 
          name="identifier" 
          placeholder="e.g. 23MIC0007 or name@vitstudent.ac.in" 
          required 
          minlength="4"
          autocomplete="username"
        />
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="userPassword">Password <span class="required">*</span></label>
        <input 
          type="password" 
          id="userPassword" 
          name="password" 
          placeholder="Enter your secret password" 
          required 
          minlength="6"
          autocomplete="current-password"
        />
      </div>

      <!-- Remember Me Checkbox -->
      <div class="form-options-row">
        <label class="remember-label">
          <input type="checkbox" name="rememberMe" id="rememberMe" />
          <span>Remember Me</span>
        </label>
        <a href="#forgot" class="portal-link">Forgot Password?</a>
      </div>

      <!-- Login and Clear Buttons -->
      <div class="btn-group">
        <button type="submit" class="btn-login">Login</button>
        <button type="reset" class="btn-clear">Clear</button>
      </div>

      <!-- Create New Account Link -->
      <div class="create-account-area">
        <span>Don't have an active account?</span>
        <a href="#signup" class="portal-link create-link">Create New Account</a>
      </div>

    </form>

    <div class="portal-footer-tag">
      CSI3029 Lab Assessment Q24 · Shaik Zabiullah (23MIC0007) · VIT Vellore
    </div>

  </div>

</body>
</html>
