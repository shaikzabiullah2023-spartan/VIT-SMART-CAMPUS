  <text x="230" y="380" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Japan · East Asia — Famous for thousands of vermilion torii gates.</text>

  <!-- Hotkey Buttons Row -->
  <rect x="175" y="408" width="155" height="34" rx="6" fill="#1F2937" stroke="#374151"/>
  <text x="252" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F3F4F6">[P] Previous</text>

