<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 500" width="100%" height="100%">
  <rect width="650" height="500" fill="#F1F5F9"/>

  <!-- Centered Login Card -->
  <rect x="100" y="30" width="450" height="440" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  
  <text x="325" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#0F172A">Student &amp; Faculty Login</text>
