<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Portal - Dashboard</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; background-color: #f1f5f9; color: #1e293b;">

  <!-- Portal Header Bar -->
  <div style="background-color: #1e3a8a; color: #ffffff; padding: 16px 24px;">
    <h1 style="margin: 0; font-size: 24px;">Student Portal</h1>
  </div>

  <!-- Main Container: Left Sidebar + Right Content -->
  <div style="display: flex; min-height: calc(100vh - 65px);">

    <!-- Left Vertical Navigation Menu using <div> tags -->
    <div style="width: 220px; background-color: #1e293b; padding: 20px 0; flex-shrink: 0;">
      <div style="padding: 12px 24px; background-color: #3b82f6;">
        <a href="index.html" style="color: #ffffff; text-decoration: none; font-weight: bold; font-size: 15px; display: block;">Dashboard</a>
      </div>
      <div style="padding: 12px 24px;">
        <a href="profile.html" style="color: #94a3b8; text-decoration: none; font-size: 15px; display: block;">Profile</a>
      </div>
      <div style="padding: 12px 24px;">
        <a href="attendance.html" style="color: #94a3b8; text-decoration: none; font-size: 15px; display: block;">Attendance</a>
      </div>
      <div style="padding: 12px 24px;">
        <a href="marks.html" style="color: #94a3b8; text-decoration: none; font-size: 15px; display: block;">Marks</a>
      </div>
      <div style="padding: 12px 24px;">
        <a href="settings.html" style="color: #94a3b8; text-decoration: none; font-size: 15px; display: block;">Settings</a>
      </div>
    </div>

    <!-- Right Content Area -->
    <div style="flex: 1; padding: 35px 40px; background-color: #f8fafc;">
      <div style="background-color: #ffffff; padding: 30px; border-radius: 8px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
        <h2 style="color: #1e3a8a; margin-top: 0; font-size: 24px;">Welcome to the VIT Student Portal Dashboard</h2>
        <p style="font-size: 16px; color: #475569; line-height: 1.6;">
          Hello <strong>Shaik Zabiullah</strong> (23MIC0007)! Here you can monitor your academic progress, course registrations, and daily attendance.
        </p>

        <div style="display: flex; gap: 20px; margin-top: 25px;">
          <div style="flex: 1; background-color: #eff6ff; border-left: 4px solid #3b82f6; padding: 15px; border-radius: 4px;">
            <div style="font-size: 13px; color: #64748b; font-weight: bold;">TOTAL REGISTERED CREDITS</div>
            <div style="font-size: 26px; font-weight: bold; color: #1e3a8a; margin-top: 4px;">24.5</div>
          </div>
          <div style="flex: 1; background-color: #ecfdf5; border-left: 4px solid #10b981; padding: 15px; border-radius: 4px;">
            <div style="font-size: 13px; color: #64748b; font-weight: bold;">OVERALL ATTENDANCE</div>
            <div style="font-size: 26px; font-weight: bold; color: #065f46; margin-top: 4px;">96.4%</div>
          </div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
