<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <rect width="850" height="500" fill="#0F172A"/>

  <!-- Card Mockup with Box Model styling -->
  <rect x="40" y="20" width="770" height="460" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>

  <text x="425" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#0F172A">Patient Registration Form (All 20 HTML5 Inputs)</text>
  <text x="425" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0284C7">CSS Box Model, Grid Alignment, Range Sliders, Pickers &amp; Image Buttons</text>

  <!-- 2-column Grid Inputs Mockup -->
  <!-- 1 & 2 -->
  <rect x="70" y="95" width="330" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="80" y="112" font-family="Arial, sans-serif" font-size="11" fill="#64748B">1. Patient Name (text)</text>
  <rect x="440" y="95" width="340" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="450" y="112" font-family="Arial, sans-serif" font-size="11" fill="#64748B">2. Email Address (email)</text>

  <!-- 3 & 4 -->
  <rect x="70" y="130" width="330" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="80" y="147" font-family="Arial, sans-serif" font-size="11" fill="#64748B">3. Password (password)</text>
  <rect x="440" y="130" width="340" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="450" y="147" font-family="Arial, sans-serif" font-size="11" fill="#64748B">4. Contact Number (tel)</text>

  <!-- 5 & 6 -->
  <rect x="70" y="165" width="330" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="80" y="182" font-family="Arial, sans-serif" font-size="11" fill="#64748B">5. Age (number)</text>
  <rect x="440" y="165" width="340" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="450" y="182" font-family="Arial, sans-serif" font-size="11" fill="#64748B">6. Date of Birth (date)</text>

  <!-- 7 & 8 -->
  <rect x="70" y="200" width="330" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="80" y="217" font-family="Arial, sans-serif" font-size="11" fill="#64748B">7. Appointment Time (time)</text>
  <rect x="440" y="200" width="340" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="450" y="217" font-family="Arial, sans-serif" font-size="11" fill="#64748B">8. Slot (datetime-local)</text>

  <!-- 9 & 10 -->
  <rect x="70" y="235" width="330" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="80" y="252" font-family="Arial, sans-serif" font-size="11" fill="#64748B">9. Website/Ref (url)</text>
  <rect x="440" y="235" width="340" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="450" y="252" font-family="Arial, sans-serif" font-size="11" fill="#64748B">10. Search Doctor (search)</text>

  <!-- 11 & 12 -->
  <rect x="70" y="270" width="330" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <circle cx="85" cy="283" r="8" fill="#0284C7"/>
  <text x="100" y="287" font-family="Arial, sans-serif" font-size="11" fill="#64748B">11. Clinic Theme (color)</text>
  <rect x="440" y="270" width="340" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="450" y="287" font-family="Arial, sans-serif" font-size="11" fill="#64748B">12. Record Upload (file)</text>

  <!-- 13. Range -->
  <rect x="70" y="305" width="710" height="26" rx="4" fill="#F1F5F9"/>
  <text x="80" y="322" font-family="Arial, sans-serif" font-size="11" fill="#334155">13. Pain Level (range: 0-10): [---------O-----] Level 4</text>

  <!-- 14, 15, 16, 17, 18 summary -->
  <text x="70" y="352" font-family="Arial, sans-serif" font-size="11" fill="#334155">14. Gender: (o) Male | 15. Allergies: [x] Pollen | 16. Blood: [O+ ▾] | 17. Address (textarea) | 18. Hidden ID</text>

  <!-- 19 & 20 Action Row -->
  <rect x="70" y="380" width="130" height="34" rx="6" fill="#0284C7"/>
  <text x="135" y="401" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">19a. Submit</text>

  <rect x="210" y="380" width="80" height="34" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="250" y="401" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">19b. Reset</text>

  <!-- 20. Image Button -->
  <rect x="620" y="380" width="160" height="34" rx="6" fill="#059669"/>
  <circle cx="640" cy="397" r="8" fill="#10B981"/>
  <text x="660" y="401" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">20. Image Button</text>

  <text x="425" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">CSI3029 Assessment Q26 · Shaik Zabiullah (23MIC0007)</text>
</svg>

