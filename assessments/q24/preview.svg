  <text x="255" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF">Login</text>
  
  <rect x="385" y="395" width="130" height="36" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="450" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Clear</text>

  <text x="325" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">Q24 Student Login Portal · Shaik Zabiullah (23MIC0007)</text>
