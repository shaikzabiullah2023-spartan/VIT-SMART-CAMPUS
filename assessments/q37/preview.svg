<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <rect width="850" height="500" fill="#090D16"/>

  <!-- Card Container -->
  <rect x="150" y="30" width="550" height="440" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Badge -->
  <rect x="290" y="55" width="270" height="24" rx="12" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)"/>
  <text x="425" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#818CF8">UNIT VIII · JAVASCRIPT KEYBOARD EVENTS</text>

  <!-- Title -->
  <text x="425" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Student Directory Search</text>
  <text x="425" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Keydown detection · Enter triggers search · Escape clears</text>

  <!-- Input Field -->
  <rect x="190" y="150" width="470" height="46" rx="8" fill="#0A0F1D" stroke="#6366F1" stroke-width="2"/>
  <circle cx="215" cy="173" r="6" fill="none" stroke="#64748B" stroke-width="2"/>
  <line x1="220" y1="178" x2="227" y2="185" stroke="#64748B" stroke-width="2"/>
  <text x="240" y="179" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">Shaik Zabiullah</text>

  <!-- Telemetry Row -->
  <rect x="190" y="215" width="470" height="60" rx="8" fill="#0A0F1D" stroke="#1F2937"/>
  <text x="210" y="235" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748B">LAST PRESSED KEY TELEMETRY</text>
  
  <text x="210" y="258" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Key: <tspan fill="#818CF8" font-family="Courier, monospace" font-weight="bold">Enter</tspan></text>
  <text x="350" y="258" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Code: <tspan fill="#818CF8" font-family="Courier, monospace" font-weight="bold">Enter</tspan></text>

  <!-- Output Alert -->
  <rect x="190" y="295" width="470" height="44" rx="8" fill="rgba(99,102,241,0.15)" stroke="#6366F1"/>
  <text x="425" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#C7D2FE">🔍 Searching for student: "Shaik Zabiullah"…</text>

  <!-- Shortcuts Row -->
  <line x1="190" y1="365" x2="660" y2="365" stroke="#1F2937"/>
  
  <rect x="200" y="380" width="135" height="42" rx="6" fill="#0A0F1D" stroke="#1F2937"/>
  <text x="267" y="398" text-anchor="middle" font-family="Courier, monospace" font-size="10" fill="#F3F4F6">[Any Key]</text>
  <text x="267" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">Detects key</text>

  <rect x="357" y="380" width="135" height="42" rx="6" fill="#0A0F1D" stroke="#1F2937"/>
  <text x="425" y="398" text-anchor="middle" font-family="Courier, monospace" font-size="10" fill="#F3F4F6">[Enter]</text>
  <text x="425" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">Search prompt</text>

  <rect x="515" y="380" width="135" height="42" rx="6" fill="#0A0F1D" stroke="#1F2937"/>
  <text x="582" y="398" text-anchor="middle" font-family="Courier, monospace" font-size="10" fill="#F3F4F6">[Esc]</text>
  <text x="582" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">Clears all</text>

  <text x="425" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748B">CSI3029 Assessment Q37 · Shaik Zabiullah (23MIC0007)</text>
</svg>

