<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Image Gallery - Arrow Keys & Enter Key</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="gallery-container">
    <div class="gallery-card">
      
      <header class="card-header">
        <div class="badge">UNIT VIII · KEYBOARD NAVIGATION</div>
        <h1>VIT Campus Landmarks Gallery</h1>
        <p class="subtitle">Use keyboard arrow keys <kbd>←</kbd> <kbd>→</kbd> to navigate landmarks. Press <kbd>Enter</kbd> to select.</p>
      </header>

      <!-- Main Gallery Viewport -->
      <div class="gallery-viewport">
        
        <!-- Landmark Artwork Container (Updated dynamically by JS) -->
        <div id="imageDisplay" class="image-stage">
          <!-- Dynamic SVG Vector Injected by script.js -->
        </div>

        <!-- Meta Bar -->
        <div class="landmark-meta">
          <div class="meta-left">
            <span id="landmarkIndex" class="index-badge">1 of 4</span>
            <h2 id="landmarkTitle" class="landmark-title">Technology Tower (TT)</h2>
          </div>
          <div class="meta-right">
            <span id="landmarkZone" class="zone-badge">Academic Complex</span>
          </div>
        </div>

      </div>

      <!-- Selection Output Banner (Triggered by Enter key) -->
      <div class="status-section">
        <div id="selectionAlert" class="selection-banner idle">Press Enter to select this campus landmark</div>
      </div>

      <!-- Keyboard Navigation Controls & Cheat Sheet -->
      <div class="keyboard-controls">
        <button type="button" class="nav-btn" onclick="navigate(-1)">
          <kbd>←</kbd> <span>Previous Landmark</span>
        </button>
        <button type="button" class="nav-btn btn-select" onclick="selectCurrentLandmark()">
          <kbd>Enter ↵</kbd> <span>Select Image</span>
        </button>
        <button type="button" class="nav-btn" onclick="navigate(1)">
          <span>Next Landmark</span> <kbd>→</kbd>
        </button>
      </div>

    </div>

    <footer class="gallery-footer">
      CSI3029 Assessment Q41 · Shaik Zabiullah (23MIC0007) · VIT Vellore
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
