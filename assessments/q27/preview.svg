<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="850" height="480" fill="#F1F5F9"/>

  <!-- Card Mockup -->
  <rect x="50" y="30" width="750" height="420" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- 3-Step Stepper -->
  <rect x="80" y="55" width="28" height="28" rx="14" fill="#2563EB"/>
  <text x="94" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF">1</text>
  <text x="118" y="74" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#1E3A8A">Part A: Details</text>

  <line x1="210" y1="69" x2="310" y2="69" stroke="#CBD5E1" stroke-width="2"/>

  <circle cx="330" cy="69" r="14" fill="#E2E8F0"/>
  <text x="330" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748B">2</text>
  <text x="352" y="74" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Part B: Payment</text>

  <line x1="450" y1="69" x2="550" y2="69" stroke="#CBD5E1" stroke-width="2"/>

  <circle cx="570" cy="69" r="14" fill="#E2E8F0"/>
  <text x="570" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748B">3</text>
  <text x="592" y="74" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Part C: Summary</text>

  <!-- Part A form preview -->
  <text x="80" y="130" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#0F172A">Part A – Customer &amp; Delivery Details</text>
  <text x="80" y="152" font-family="Arial, sans-serif" font-size="12" fill="#64748B">3 linked pages: Customer Details -> Payment Selection -> Cart Summary</text>

  <rect x="80" y="175" width="330" height="30" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="95" y="195" font-family="Arial, sans-serif" font-size="11" fill="#64748B">Customer Name (text)</text>
  <rect x="440" y="175" width="330" height="30" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="455" y="195" font-family="Arial, sans-serif" font-size="11" fill="#64748B">Email Address (email)</text>

  <rect x="80" y="220" width="330" height="30" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="95" y="240" font-family="Arial, sans-serif" font-size="11" fill="#64748B">Mobile Number (tel)</text>
  <rect x="440" y="220" width="330" height="30" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="455" y="240" font-family="Arial, sans-serif" font-size="11" fill="#64748B">Delivery Date (date)</text>

  <rect x="80" y="265" width="690" height="40" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="95" y="290" font-family="Arial, sans-serif" font-size="11" fill="#64748B">Delivery Address (textarea)</text>

  <rect x="80" y="320" width="215" height="30" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="95" y="340" font-family="Arial, sans-serif" font-size="11" fill="#64748B">City (text)</text>
  <rect x="315" y="320" width="220" height="30" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="330" y="340" font-family="Arial, sans-serif" font-size="11" fill="#64748B">State (select)</text>
  <rect x="555" y="320" width="215" height="30" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="570" y="340" font-family="Arial, sans-serif" font-size="11" fill="#64748B">PIN Code (number)</text>

  <!-- Button to Part B -->
  <rect x="545" y="380" width="225" height="36" rx="6" fill="#2563EB"/>
  <text x="657" y="403" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">Proceed to Part B (Payment) →</text>

  <text x="425" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">CSI3029 Assessment Q27 · Shaik Zabiullah (23MIC0007)</text>
</svg>

