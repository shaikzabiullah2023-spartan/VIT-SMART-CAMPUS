<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <rect width="850" height="500" fill="#090D16"/>

  <!-- Card Container -->
  <rect x="180" y="25" width="490" height="450" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Badge -->
  <rect x="300" y="48" width="250" height="24" rx="12" fill="rgba(249,115,22,0.15)" stroke="rgba(249,115,22,0.3)"/>
  <text x="425" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FB923C">UNIT VII · REAL-TIME DOM MOUSE EVENTS</text>

  <!-- Title -->
  <text x="425" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Interactive Traffic Signal</text>

  <!-- Signal Housing -->
  <rect x="375" y="115" width="100" height="230" rx="30" fill="#1F2937" stroke="#374151" stroke-width="3"/>
  <rect x="417" y="345" width="16" height="25" fill="#374151"/>

  <!-- Red Bulb (Hover Highlight Active) -->
  <circle cx="425" cy="155" r="28" fill="#EF4444" filter="drop-shadow(0 0 16px #EF4444)"/>
  <circle cx="417" cy="147" r="7" fill="rgba(255,255,255,0.3)"/>

  <!-- Yellow Bulb (Dim Idle) -->
  <circle cx="425" cy="225" r="28" fill="#422006" stroke="#000000" stroke-width="2"/>

  <!-- Green Bulb (Dim Idle) -->
  <circle cx="425" cy="295" r="28" fill="#022C22" stroke="#000000" stroke-width="2"/>

  <!-- Action Board (Displaying STOP) -->
  <rect x="220" y="380" width="410" height="60" rx="10" fill="#0A0F1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="425" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#EF4444" letter-spacing="2">STOP</text>
  <text x="425" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Vehicles must come to a complete halt behind the stop line.</text>

  <!-- Footer -->
  <text x="425" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748B">CSI3029 Assessment Q36 · Shaik Zabiullah (23MIC0007)</text>
</svg>

