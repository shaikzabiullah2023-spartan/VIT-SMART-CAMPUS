<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <rect width="850" height="500" fill="#090D16"/>

  <!-- Card Container -->
  <rect x="150" y="30" width="550" height="440" rx="14" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Badge -->
  <rect x="180" y="55" width="230" height="24" rx="12" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.3)"/>
  <text x="295" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#60A5FA">CORPORATE HRMS · ONBOARDING PORTAL</text>

  <!-- Title -->
  <text x="180" y="108" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Employee Registration Form</text>
  <text x="180" y="128" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">Regex validation (/^EMP[0-9]{4}$/) &amp; employment category check</text>

  <!-- Alert -->
  <rect x="180" y="145" width="490" height="34" rx="6" fill="rgba(16,185,129,0.15)" stroke="#10B981"/>
  <text x="200" y="166" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#6EE7B7">✓ Success: Employee EMP4082 registered under category Full-Time</text>

  <!-- Input Field -->
  <text x="180" y="205" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E5E7EB">Employee ID *</text>
  <rect x="180" y="215" width="490" height="38" rx="6" fill="#1F2937" stroke="#10B981" stroke-width="1.5"/>
  <rect x="180" y="215" width="45" height="38" rx="6" fill="#111827"/>
  <text x="202" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9CA3AF">ID</text>
  <text x="235" y="240" font-family="Courier, monospace" font-size="14" font-weight="bold" fill="#F9FAFB">EMP4082</text>
  <text x="180" y="268" font-family="Arial, sans-serif" font-size="11" fill="#34D399">✓ Valid Employee ID format.</text>

  <!-- Employment Radios -->
  <text x="180" y="295" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E5E7EB">Employment Type *</text>
  
  <!-- Radio 1 Selected -->
  <rect x="180" y="305" width="490" height="38" rx="6" fill="rgba(59,130,246,0.1)" stroke="#3B82F6"/>
  <circle cx="202" cy="324" r="8" fill="#3B82F6"/>
  <circle cx="202" cy="324" r="3" fill="#111827"/>
  <text x="225" y="328" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Full-Time</text>
  <text x="310" y="328" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">(Permanent 40 hrs/week)</text>

  <!-- Radio 2 -->
  <rect x="180" y="348" width="240" height="34" rx="6" fill="#1F2937" stroke="#374151"/>
  <circle cx="202" cy="365" r="7" fill="none" stroke="#6B7280" stroke-width="2"/>
  <text x="222" y="369" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">Part-Time</text>

  <!-- Radio 3 -->
  <rect x="430" y="348" width="240" height="34" rx="6" fill="#1F2937" stroke="#374151"/>
  <circle cx="452" cy="365" r="7" fill="none" stroke="#6B7280" stroke-width="2"/>
  <text x="472" y="369" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">Intern</text>

  <!-- Buttons -->
  <rect x="180" y="405" width="370" height="38" rx="8" fill="#2563EB"/>
  <text x="365" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Validate &amp; Submit Registration →</text>

  <rect x="565" y="405" width="105" height="38" rx="8" fill="none" stroke="#374151"/>
  <text x="617" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9CA3AF">Clear</text>
</svg>

