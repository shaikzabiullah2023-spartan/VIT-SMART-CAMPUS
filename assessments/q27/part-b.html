<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Part B: Payment Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="checkout-wrapper">
    
    <!-- Multi-Step Stepper Header -->
    <header class="stepper-header">
      <div class="step-indicator completed">
        <span class="step-num">&#10003;</span>
        <span class="step-title">Part A: Customer &amp; Delivery</span>
      </div>
      <div class="step-connector active"></div>
      <div class="step-indicator active">
        <span class="step-num">2</span>
        <span class="step-title">Part B: Payment Details</span>
      </div>
      <div class="step-connector"></div>
      <div class="step-indicator">
        <span class="step-num">3</span>
        <span class="step-title">Part C: Cart Summary</span>
      </div>
    </header>

    <div class="step-card">
      <div class="card-intro">
        <h2>Part B – Payment Details</h2>
        <p>Choose your preferred payment method and enter authorization details.</p>
      </div>

      <!-- Part B Form -->
      <form action="part-c.html" method="GET" class="checkout-form">
        
        <!-- Payment Method (Radio Buttons: Credit Card, Debit Card, UPI, Net Banking, Cash on Delivery) -->
        <div class="input-cell full-width">
          <label>Payment Method <span class="required">*</span></label>
          <div class="payment-methods-grid">
            <label class="pay-option">
              <input type="radio" name="paymentMethod" value="Credit Card" checked required />
              <span>Credit Card</span>
            </label>
            <label class="pay-option">
              <input type="radio" name="paymentMethod" value="Debit Card" />
              <span>Debit Card</span>
            </label>
            <label class="pay-option">
              <input type="radio" name="paymentMethod" value="UPI" />
              <span>UPI / QR</span>
            </label>
            <label class="pay-option">
              <input type="radio" name="paymentMethod" value="Net Banking" />
              <span>Net Banking</span>
            </label>
            <label class="pay-option">
              <input type="radio" name="paymentMethod" value="Cash on Delivery" />
              <span>Cash on Delivery</span>
            </label>
          </div>
        </div>

        <div class="form-row">
          <div class="input-cell">
            <label for="cardHolder">Card Holder Name (text) <span class="required">*</span></label>
            <input type="text" id="cardHolder" name="cardHolderName" placeholder="Name as printed on card" required />
          </div>

          <div class="input-cell">
            <label for="cardNumber">Card Number (password/text) <span class="required">*</span></label>
            <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" pattern="[0-9 ]{16,19}" required />
          </div>
        </div>

        <div class="form-row three-col">
          <div class="input-cell">
            <label for="cardExpiry">Expiry Date (month) <span class="required">*</span></label>
            <input type="month" id="cardExpiry" name="expiryDate" required />
          </div>

          <div class="input-cell">
            <label for="cardCvv">CVV (password) <span class="required">*</span></label>
            <input type="password" id="cardCvv" name="cvv" placeholder="•••" maxlength="4" pattern="[0-9]{3,4}" required />
          </div>

          <div class="input-cell">
            <label for="upiId">UPI ID (text)</label>
            <input type="text" id="upiId" name="upiId" placeholder="username@okhdfcbank" />
          </div>
        </div>

        <!-- Terms and Conditions (Checkbox) -->
        <div class="input-cell full-width" style="margin-top: 15px;">
          <label class="terms-checkbox">
            <input type="checkbox" name="terms" id="terms" required />
            <span>I agree to the <a href="#" style="color:#2563eb;">Terms and Conditions</a>, Privacy Policy, and Refund Guidelines. <span class="required">*</span></span>
          </label>
        </div>

        <div class="stepper-actions">
          <a href="index.html" class="btn-step-prev">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
            <span>Back to Part A</span>
          </a>
          <button type="submit" class="btn-step-next">
            <span>Proceed to Part C (Cart Summary)</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>

      </form>
    </div>

    <footer class="checkout-footer">
      CSI3029 Assessment Q27 (Part B) · Shaik Zabiullah (23MIC0007) · VIT Vellore
    </footer>

  </div>

</body>
</html>
