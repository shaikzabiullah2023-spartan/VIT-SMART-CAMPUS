  <!-- Username -->
  <text x="135" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">Username / Email Address</text>
  <rect x="135" y="245" width="380" height="34" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="150" y="267" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">23MIC0007 / name@vitstudent.ac.in</text>

  <!-- Password -->
  <text x="135" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">Password</text>
  <rect x="135" y="315" width="380" height="34" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="150" y="337" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">••••••••••••</text>

