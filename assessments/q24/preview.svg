  <!-- Audio Player Mockup -->
  <rect x="135" y="120" width="380" height="40" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="160" cy="140" r="10" fill="#1E40AF"/>
  <polygon points="157,135 167,140 157,145" fill="#FFFFFF"/>
  <line x1="185" y1="140" x2="480" y2="140" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
  <circle cx="280" cy="140" r="6" fill="#1E40AF"/>

  <!-- Role radio -->
  <text x="135" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">User Role:</text>
