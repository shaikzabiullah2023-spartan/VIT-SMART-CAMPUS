<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <rect width="850" height="500" fill="#090D16"/>

  <!-- Card Rig -->
  <rect x="200" y="25" width="450" height="450" rx="18" fill="#111827" stroke="#1F2937" stroke-width="2"/>

  <!-- Green Terminal Area -->
  <rect x="200" y="25" width="450" height="230" rx="18" fill="#032014"/>
  <rect x="200" y="235" width="450" height="20" fill="#032014"/>
  <line x1="200" y1="255" x2="650" y2="255" stroke="#1F2937" stroke-width="2"/>

  <!-- Bank Brand Header -->
  <text x="230" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34D399">🏛️ VIT SECURE BANKING ATM</text>
  <rect x="520" y="42" width="105" height="18" rx="3" fill="rgba(16,185,129,0.15)" stroke="#10B981"/>
  <text x="572" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6EE7B7">256-BIT ENCRYPTED</text>

  <!-- Prompt -->
  <text x="425" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">ENTER 4-DIGIT SECURE PIN</text>
  <text x="425" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#A7F3D0">Type digits using keyboard. Non-numeric keys are blocked.</text>

  <!-- PIN Box with Security Dots -->
  <rect x="335" y="130" width="180" height="46" rx="8" fill="#02140C" stroke="#10B981" stroke-width="2"/>
  <text x="425" y="162" text-anchor="middle" font-family="Courier, monospace" font-size="28" fill="#34D399" letter-spacing="10">••••</text>

  <!-- Success Notification Box -->
  <rect x="230" y="190" width="390" height="34" rx="6" fill="rgba(16,185,129,0.25)" stroke="#10B981"/>
  <text x="425" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6EE7B7">✓ PIN Submitted Successfully</text>

  <!-- Virtual Keypad (Lower half) -->
  <rect x="290" y="280" width="70" height="36" rx="6" fill="#1F2937" stroke="#374151"/>
  <text x="325" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">1</text>
  <rect x="390" y="280" width="70" height="36" rx="6" fill="#1F2937" stroke="#374151"/>
  <text x="425" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">2</text>
  <rect x="490" y="280" width="70" height="36" rx="6" fill="#1F2937" stroke="#374151"/>
  <text x="525" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">3</text>

  <rect x="290" y="325" width="70" height="36" rx="6" fill="#1F2937" stroke="#374151"/>
  <text x="325" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">4</text>
  <rect x="390" y="325" width="70" height="36" rx="6" fill="#1F2937" stroke="#374151"/>
  <text x="425" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">5</text>
  <rect x="490" y="325" width="70" height="36" rx="6" fill="#1F2937" stroke="#374151"/>
  <text x="525" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">6</text>

  <rect x="290" y="370" width="70" height="36" rx="6" fill="#450A0A" stroke="#EF4444"/>
  <text x="325" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FCA5A5">CLEAR</text>
  <rect x="390" y="370" width="70" height="36" rx="6" fill="#1F2937" stroke="#374151"/>
  <text x="425" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">0</text>
  <rect x="490" y="370" width="70" height="36" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="525" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#6EE7B7">ENTER</text>

  <!-- Footer -->
  <text x="425" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748B">CSI3029 Assessment Q38 · Shaik Zabiullah (23MIC0007)</text>
</svg>

