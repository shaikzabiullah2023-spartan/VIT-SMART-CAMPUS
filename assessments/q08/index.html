<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Card using Div</title>
</head>
<body style="background-color: #f1f5f9; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0;">

  <!-- Outer <div> as Profile Card with Border and Centered Content -->
  <div style="border: 2px solid #2563eb; width: 340px; padding: 25px; text-align: center; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.15);">
    
    <!-- Profile Image (Centered SVG Vector) -->
    <div style="margin: 0 auto 15px auto;">
      <svg width="110" height="110" viewBox="0 0 100 100" style="border-radius: 50%; border: 3px solid #2563eb; background: #eff6ff;">
        <circle cx="50" cy="50" r="48" fill="#eff6ff" />
        <circle cx="50" cy="38" r="18" fill="#1e40af" />
        <path d="M 22 84 Q 50 54 78 84 Z" fill="#2563eb" />
      </svg>
    </div>

    <!-- Student Name -->
    <h2 style="color: #1e3a8a; margin: 8px 0; font-size: 22px;">SHAIK ZABIULLAH</h2>
    <p style="color: #64748b; font-size: 14px; margin: 2px 0 12px 0; font-weight: bold;">Reg. No: 23MIC0007</p>

    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">

    <!-- Department -->
    <p style="margin: 6px 0; font-size: 14px; color: #334155;">
      <strong>Department:</strong><br>
      School of Computer Science and Engineering (SCOPE)
    </p>

    <!-- College Name -->
    <p style="margin: 10px 0 0 0; font-size: 14px; color: #334155;">
      <strong>College Name:</strong><br>
      Vellore Institute of Technology (VIT), Vellore
    </p>

    <div style="margin-top: 20px; font-size: 12px; color: #94a3b8;">
      CSI3029 Front End Design & Testing
    </div>
  </div>

</body>
</html>
