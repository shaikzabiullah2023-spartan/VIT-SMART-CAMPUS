<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="850" height="480" fill="#F8FAFC"/>

  <!-- Gradient Hero Banner -->
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="850" height="200" fill="url(#heroGrad)"/>
  
  <text x="425" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="2">APOLLO HEALTHCARE SMART HOSPITAL</text>
  <text x="425" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#A5F3FC" letter-spacing="3">PRECISION MEDICINE · COMPASSIONATE CARE</text>
  
  <rect x="340" y="130" width="170" height="36" rx="18" fill="#0284C7"/>
  <text x="425" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">Book Consultation</text>

  <!-- 4 Cards with Different Borders -->
  <!-- Card 1: Solid Border (Red) -->
  <rect x="40" y="230" width="170" height="180" rx="14" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="125" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#7F1D1D">Emergency</text>
  <text x="125" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#991B1B">Solid Border</text>
  <text x="125" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#EF4444">&lt; 4 min triage</text>

  <!-- Card 2: Dashed Border (Teal) -->
  <rect x="235" y="230" width="170" height="180" rx="20" fill="#F0FDFA" stroke="#0D9488" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="320" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#134E4A">Consultation</text>
  <text x="320" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#115E59">Dashed Border</text>
  <text x="320" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0D9488">120+ Doctors</text>

  <!-- Card 3: Double Border (Indigo) -->
  <rect x="430" y="230" width="170" height="180" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="4"/>
  <text x="515" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#312E81">Packages</text>
  <text x="515" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3730A3">Double Border</text>
  <text x="515" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4F46E5">From ₹1,499</text>

  <!-- Card 4: Groove Border (Amber) -->
  <rect x="625" y="230" width="170" height="180" rx="24" fill="#FFFBEB" stroke="#D97706" stroke-width="4"/>
  <text x="710" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#78350F">Contact</text>
  <text x="710" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400E">Groove Border</text>
  <text x="710" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#D97706">24/7 Helpline</text>

  <text x="425" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748B">Smart Hospital Appointment Portal (Q21) · Shaik Zabiullah (23MIC0007)</text>
</svg>

